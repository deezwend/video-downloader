[package]
name = "vdl-core"
edition.workspace = true
version.workspace = true

[dependencies]
tokio = { version = "1.54", features = ["rt-multi-thread", "process", "io-util", "sync", "time", "macros", "fs"] }
rusqlite = { version = "0.41", features = ["bundled"] }
reqwest = { version = "0.13" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
uuid = { version = "1", features = ["v4"] }
regex = "1"
parking_lot = "0.13"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading"] }
