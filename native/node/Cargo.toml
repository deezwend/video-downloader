[package]
name = "vdl"
edition.workspace = true
version.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
vdl-core = { path = "../core" }
napi = { version = "3", default-features = false, features = ["napi6", "async"] }
napi-derive = "3"
serde = "1"
serde_json = "1"

[build-dependencies]
napi-build = "2"
